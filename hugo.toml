baseURL = 'https://myyacht.kr/'
enableRobotsTXT = false
cleanDestinationDir = true
languageCode = 'ko-KR'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = false
title = '제부도 프리미엄 요트 투어 | 마이요트 (MyYacht)'
theme = 'PaperMod'

[languages]
  [languages.ko]
    languageName = 'Korean'
    weight = 1

[taxonomies]
  category = "categories"

[params]
  comments = true
  defaultTheme = 'dark'
  env = 'production'
  siteURL = "https://myyacht.kr"
  description = "1급 해기사 선장이 직접 운항하는 제부도 프리미엄 요트 투어. 가족, 커플, 반려견과 함께 안전하고 특별한 세일링을 경험하세요."
  keywords = ["제부도 요트", "제부도 요트투어", "요트 체험", "세일링", "선셋 요트투어", "프라이빗 요트", "마이요트", "myyacht"]
  images = ["images/og-main.jpg"]
  
  [params.schema]
    disable = true

  [params.assets]
    favicon = "/favicon.png"
    favicon16x16 = "/favicon.png"
    favicon32x32 = "/favicon.png"
    apple_touch_icon = "/favicon.png"

  [params.commentsConfig]
    [params.commentsConfig.utterances]
      repo = "capt-shlee/myyacht"
      issueTerm = "pathname"
      label = "comment"
      theme = "github-dark"


  [[params.socialIcons]]
    name = "blog"
    url = "https://blog.naver.com/capt_lima"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/my_yacht_kr"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@my_yacht"

  [params.verification]
    google = 'vk9uVz5A_U-0jsZt_TCrZrVQNmoT8HVy77HTr4HPlzg'

  [params.analytics.naver]
    SiteVerificationTag = "bffb5f33e21815cedf873eb24a4886cac44f5fb1"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "Captain's Log"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    identifier = "jebu_tide"
    name = "제부도 바닷길"
    url = "/jebu-tide/"
    weight = 15

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions.cjk]
      enable = true
    [markup.goldmark.renderer]
      unsafe = true
  
[minify]
  disableXML = true
  minifyOutput = true

