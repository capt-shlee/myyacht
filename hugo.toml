baseURL = 'https://myyacht.kr/'
enableRobotsTXT = true
languageCode = 'ko-kr'
title = '제부도 요트 투어 No.1 - 1급 해기사 선장의 마이요트'
theme = 'PaperMod'

[params]
  comments = true
  defaultTheme = 'dark'
  env = 'production'
  description = "제부도 프리미엄 요트 투어! 1급 해기사 선장의 안전한 운항과 프랑스 듀포 요트의 품격. 선셋 투어부터 세일링 교육까지 감동을 선사합니다."
  keywords = ["제부도요트", "요트투어", "세일링클럽", "요트교육", "myyacht", "마이요트", "서울 근교 데이트", "프라이빗 요트 투어", "제부도 가볼만한 곳", "제부도 요트 체험", "요트", "세일요트", "보트"]
  images = ["images/og-main.jpg"]
  
  [params.assets]
    favicon = "/favicon.png"
    favicon16x16 = "/favicon.png"
    favicon32x32 = "/favicon.png"
    apple_touch_icon = "/favicon.png"

  [params.commentsConfig]
    [params.commentsConfig.utterances]
      repo = "capt-shlee/myyacht"
      issueTerm = "pathname"
      label = "comment"
      theme = "github-dark"


  [[params.socialIcons]]
    name = "blog"
    url = "https://blog.naver.com/capt_lima"
  [[params.socialIcons]]
    name = "instagram"
    url = "https://www.instagram.com/my_yacht_kr"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@my_yacht"

  [params.verification]
    google = 'vk9uVz5A_U-0jsZt_TCrZrVQNmoT8HVy77HTr4HPlzg'

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "posts"
    name = "Captain's Log"
    url = "/posts/"
    weight = 20

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  
[minify]
  disableXML = true
  minifyOutput = true
