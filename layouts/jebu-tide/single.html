{{- define "main" }}
<article class="post-single tide-page">
    <header class="post-header tide-page-header">
        <h1 class="post-title">제부도 바닷길 일정 보기</h1>
        <p class="post-description">제부도 요트투어 출발 전에 바닷길 열림·닫힘 시간을 날짜별로 확인하세요.</p>
    </header>

    <section class="tide-board" aria-label="제부도 바닷길 일정 조회">
        <form class="tide-form" id="tide-form">
            <label for="tide-date">조회 날짜</label>
            <div class="tide-form-controls">
                <input id="tide-date" name="tide-date" type="date" required>
                <button type="submit" class="tide-btn tide-btn-accent">일정 조회</button>
            </div>
        </form>

        <div class="tide-status-row">
            <span id="tide-status-badge" class="tide-status-badge">불러오는 중</span>
            <p id="tide-summary" class="tide-summary">제부도 바닷길 정보를 불러오는 중입니다.</p>
        </div>

        <div class="tide-timeline" aria-hidden="true">
            <div class="tide-timeline-track" id="tide-timeline-track"></div>
            <div class="tide-timeline-scale"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
            <div class="tide-timeline-legend">
                <span class="tide-legend-item"><i class="tide-legend-dot open"></i>열림</span>
                <span class="tide-legend-item"><i class="tide-legend-dot closed"></i>닫힘</span>
                <span class="tide-legend-item"><i class="tide-legend-dot now"></i>현재</span>
            </div>
        </div>

        <div class="tide-list-wrap">
            <p class="tide-list-title">열림 예상 시간</p>
            <ul class="tide-open-list" id="tide-open-list">
                <li>데이터를 불러오는 중입니다.</li>
            </ul>
        </div>

        <section class="tide-weather" id="tide-weather" aria-label="출항 참고 날씨">
            <p class="tide-weather-title">출항 참고 날씨</p>
            <div class="tide-weather-grid">
                <div class="tide-weather-item"><span class="label">상태</span><strong id="weather-summary">-</strong></div>
                <div class="tide-weather-item"><span class="label">기온</span><strong id="weather-temp">-</strong></div>
                <div class="tide-weather-item"><span class="label">바람</span><strong id="weather-wind">-</strong></div>
                <div class="tide-weather-item"><span class="label">일출/일몰</span><strong id="weather-sun">-</strong></div>
            </div>
        </section>

        <details class="tide-app-panel">
            <summary>원본 앱 그래프 그대로 보기</summary>
            <iframe id="tide-app-embed" class="tide-app-embed" title="제부도 바닷길 원본 앱 그래프"
                src="https://jebu-marina.vercel.app/public/tide?utm_source=myyacht_tide_page&utm_medium=embed&utm_campaign=sea_road_live"
                loading="lazy"></iframe>
        </details>

        <p id="tide-footnote" class="tide-footnote">데이터 제공: Jebu Marina 공개 API</p>

        <div class="tide-actions">
            <a class="tide-btn" href="/#tour">요트투어 코스·요금 보기</a>
            <a class="tide-btn tide-btn-accent" href="https://m.place.naver.com/place/1673800591/home" target="_blank"
                rel="noopener noreferrer">요트투어 예약 문의</a>
        </div>
    </section>
</article>

<style>
    .tide-page {
        max-width: 980px;
        margin: 0 auto;
        padding-top: 96px;
    }

    .tide-page-header {
        margin-bottom: 14px;
    }

    #main-header .nav-container {
        max-width: 980px;
    }

    #main-header .main-nav {
        margin-left: auto;
    }

    #main-header .nav-list {
        display: flex !important;
        gap: 16px;
        align-items: center;
    }

    #main-header .mobile-toggle {
        display: none !important;
    }

    #main-header .nav-link {
        font-size: 0.9rem;
    }

        border-radius: 20px;
        background: linear-gradient(180deg, rgba(10, 25, 47, 0.48) 0%, rgba(10, 25, 47, 0.64) 100%);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18);
        padding: 20px;

        letter-spacing: 0.02em;

    .tide-form-controls {
        display: flex;

        min-width: 190px;
        flex: 1 1 220px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(8, 20, 39, 0.65);
        color: #eef3fc;
        padding: 10px 12px;

        display: grid;
        gap: 6px;
    }

    .tide-status-badge {
        width: fit-content;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: #e6edf8;
        font-size: 0.76rem;
        letter-spacing: 0.02em;

        background: rgba(111, 218, 255, 0.12);

    .tide-timeline-open {
        background: rgba(123, 211, 255, 0.82);
        color: rgba(6, 22, 42, 0.92);
    }

    .tide-timeline-closed {
        background: rgba(26, 38, 58, 0.72);
        color: rgba(230, 237, 248, 0.74);
    }

    .tide-timeline-now {
        position: absolute;
        top: -3px;
        width: 2px;
        height: 24px;
        border-radius: 1px;

        display: flex;
        justify-content: space-between;
        color: rgba(230, 237, 248, 0.6);

    .tide-legend-item {

        gap: 6px;
    }

    .tide-legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
    }

    .tide-legend-dot.open {
        background: rgba(123, 211, 255, 0.82);
    }

    .tide-legend-dot.closed {
        background: rgba(26, 38, 58, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .tide-legend-dot.now {
        background: rgba(240, 223, 182, 0.95);
    }

    .tide-list-wrap {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 10px;
    }

    .tide-list-title {
        margin: 0 0 6px;
        color: rgba(230, 237, 248, 0.88);
        font-size: 0.86rem;
    }

    .tide-open-list {
        margin: 0;
        padding-left: 18px;
        color: rgba(230, 237, 248, 0.92);
        font-size: 0.9rem;
        line-height: 1.6;
    }

    .tide-weather {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 10px;
        display: grid;
        gap: 8px;
    }

    .tide-weather-title {
        margin: 0;
        color: rgba(230, 237, 248, 0.88);
        font-size: 0.86rem;
    }

    .tide-weather-grid {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .tide-weather-item {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 10px;
        padding: 9px 10px;
        display: grid;
        gap: 4px;
    }

    .tide-weather-item .label {
        color: rgba(230, 237, 248, 0.6);
        font-size: 0.72rem;
    }

    .tide-weather-item strong {
        color: rgba(236, 242, 252, 0.95);
        font-size: 0.88rem;
        line-height: 1.35;
        font-weight: 600;
    }

    .tide-app-panel {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 10px;
    }

    .tide-app-panel summary {
        cursor: pointer;
        color: rgba(230, 237, 248, 0.86);
        font-size: 0.86rem;
    }

    .tide-app-panel summary:hover {
        color: rgba(245, 232, 191, 0.95);
    }

    .tide-app-embed {
        width: 100%;
        min-height: 560px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        margin-top: 10px;
        background: rgba(8, 20, 39, 0.55);
    }

    .tide-footnote {
        margin: 0;
        color: rgba(230, 237, 248, 0.55);
        font-size: 0.76rem;
    }

    .tide-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .tide-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 9px 13px;
        font-size: 0.82rem;
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #e4ebf7;
        background: rgba(255, 255, 255, 0.03);
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .tide-btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
    }

    .tide-btn-accent {
        border-color: rgba(212, 175, 55, 0.45);
        background: rgba(212, 175, 55, 0.12);
        color: #f5e8bf;
    }

    .tide-btn-accent:hover {
        border-color: rgba(212, 175, 55, 0.65);
        background: rgba(212, 175, 55, 0.2);
    }

    footer .container {
        text-align: center;
    }

    footer .logo {
        display: inline-flex;
        justify-content: center;
        margin: 0 auto;
    }

    @media (max-width: 640px) {
        .tide-page {
            padding-top: 84px;
        }

        .tide-board {
            padding: 16px 13px;
            border-radius: 16px;
        }

        .tide-form input[type="date"] {
            min-width: 0;
            width: 100%;
        }

        .tide-btn {
            width: 100%;
        }

        .tide-timeline-open {
            font-size: 0.58rem;
        }

        .tide-timeline-legend {
            gap: 8px;
            font-size: 0.68rem;
        }

        .tide-weather-grid {
            grid-template-columns: 1fr;
        }

        .tide-app-embed {
            min-height: 480px;
        }

        #main-header .nav-list {
            gap: 10px;
        }

        #main-header .nav-link {
            font-size: 0.8rem;
        }
    }
</style>

<script>
    (() => {
        const apiBase = 'https://jebu-marina.vercel.app/api/public/tide';
        const dateInput = document.getElementById('tide-date');
        const tideForm = document.getElementById('tide-form');
        const statusBadge = document.getElementById('tide-status-badge');
        const summaryEl = document.getElementById('tide-summary');
        const timelineTrackEl = document.getElementById('tide-timeline-track');
        const openListEl = document.getElementById('tide-open-list');
        const footnoteEl = document.getElementById('tide-footnote');
        const weatherSummaryEl = document.getElementById('weather-summary');
        const weatherTempEl = document.getElementById('weather-temp');
        const weatherWindEl = document.getElementById('weather-wind');
        const weatherSunEl = document.getElementById('weather-sun');
        const appEmbedEl = document.getElementById('tide-app-embed');

        const pad = (n) => String(n).padStart(2, '0');

        const getKstDate = () => {
            const nowKst = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
            return `${nowKst.getFullYear()}-${pad(nowKst.getMonth() + 1)}-${pad(nowKst.getDate())}`;
        };

        const isYmd = (value) => /^\d{4}-\d{2}-\d{2}$/.test(value);

        const hhmmToMinutes = (hhmm) => {
            if (!hhmm || typeof hhmm !== 'string') return null;
            const [hRaw, mRaw] = hhmm.split(':');
            const h = Number(hRaw);
            const m = Number(mRaw);
            if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
            if (h === 24 && m === 0) return 1440;
            if (h < 0 || h > 23 || m < 0 || m > 59) return null;
            return h * 60 + m;
        };

        const minutesToHhmm = (minutes) => {
            if (!Number.isFinite(minutes)) return '--:--';
            if (minutes <= 0) return '00:00';
            if (minutes >= 1440) return '24:00';
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const normalizeOpenWindows = (openWindows) => {
            if (!Array.isArray(openWindows) || openWindows.length === 0) return [];

            const valid = openWindows
                .map((range) => {
                    const start = hhmmToMinutes(range.start);
                    const end = hhmmToMinutes(range.end);
                    if (start === null || end === null || end <= start) return null;
                    return { start: Math.max(0, start), end: Math.min(1440, end) };
                })
                .filter(Boolean)
                .sort((a, b) => a.start - b.start);

            if (valid.length === 0) return [];

            const merged = [valid[0]];
            for (let i = 1; i < valid.length; i += 1) {
                const current = valid[i];
                const last = merged[merged.length - 1];
                if (current.start <= last.end) {
                    last.end = Math.max(last.end, current.end);
                } else {
                    merged.push(current);
                }
            }
            return merged;
        };

        const formatDateLabel = (dateYmd) => {
            if (!isYmd(dateYmd)) return dateYmd;
            const [y, m, d] = dateYmd.split('-').map(Number);
            return `${y}년 ${m}월 ${d}일`;
        };

        const setStatus = (label, state) => {
            statusBadge.textContent = label;
            statusBadge.classList.remove('open', 'closed');
            if (state) statusBadge.classList.add(state);
        };

        const renderTimeline = (openWindows, dateYmd) => {
            timelineTrackEl.innerHTML = '';
            const mergedOpen = normalizeOpenWindows(openWindows);

            const segments = [];
            let cursor = 0;
            mergedOpen.forEach((range) => {
                if (range.start > cursor) {
                    segments.push({ kind: 'closed', start: cursor, end: range.start });
                }
                segments.push({ kind: 'open', start: range.start, end: range.end });
                cursor = range.end;
            });
            if (cursor < 1440) {
                segments.push({ kind: 'closed', start: cursor, end: 1440 });
            }
            if (segments.length === 0) {
                segments.push({ kind: 'closed', start: 0, end: 1440 });
            }

            segments.forEach((segmentData) => {
                const segment = document.createElement('span');
                const widthPercent = ((segmentData.end - segmentData.start) / 1440) * 100;
                segment.className = `tide-timeline-segment ${segmentData.kind === 'open' ? 'tide-timeline-open' : 'tide-timeline-closed'}`;
                segment.style.left = `${(segmentData.start / 1440) * 100}%`;
                segment.style.width = `${widthPercent}%`;
                if (widthPercent >= 12) {
                    const label = segmentData.kind === 'open' ? '열림' : '닫힘';
                    segment.textContent = `${label} ${minutesToHhmm(segmentData.start)}~${minutesToHhmm(segmentData.end)}`;
                }
                timelineTrackEl.appendChild(segment);
            });

            if (dateYmd !== getKstDate()) return;
            const nowKst = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
            const nowMin = nowKst.getHours() * 60 + nowKst.getMinutes();
            const marker = document.createElement('span');
            marker.className = 'tide-timeline-now';
            marker.style.left = `${(nowMin / 1440) * 100}%`;
            timelineTrackEl.appendChild(marker);
        };

        const renderOpenList = (openWindows) => {
            openListEl.innerHTML = '';
            if (!Array.isArray(openWindows) || openWindows.length === 0) {
                const li = document.createElement('li');
                li.textContent = '열림 구간 데이터가 없습니다.';
                openListEl.appendChild(li);
                return;
            }

            openWindows.forEach((range) => {
                const li = document.createElement('li');
                li.textContent = `${range.start} ~ ${range.end}`;
                openListEl.appendChild(li);
            });
        };

        const renderWeather = (weather) => {
            if (!weather || typeof weather !== 'object') {
                weatherSummaryEl.textContent = '-';
                weatherTempEl.textContent = '-';
                weatherWindEl.textContent = '-';
                weatherSunEl.textContent = '-';
                return;
            }

            weatherSummaryEl.textContent = weather.summary || '정보 없음';
            weatherTempEl.textContent = Number.isFinite(weather.tempC) ? `${weather.tempC}°C` : '정보 없음';
            weatherWindEl.textContent = Number.isFinite(weather.windMs) ? `${weather.windMs} m/s` : '정보 없음';
            if (weather.sunrise && weather.sunset) {
                weatherSunEl.textContent = `${weather.sunrise} / ${weather.sunset}`;
            } else {
                weatherSunEl.textContent = '정보 없음';
            }
        };

        const syncEmbedDate = (dateYmd) => {
            if (!appEmbedEl) return;
            const embedUrl = new URL('https://jebu-marina.vercel.app/public/tide');
            embedUrl.searchParams.set('date', dateYmd);
            embedUrl.searchParams.set('utm_source', 'myyacht_tide_page');
            embedUrl.searchParams.set('utm_medium', 'embed');
            embedUrl.searchParams.set('utm_campaign', 'sea_road_live');
            appEmbedEl.src = embedUrl.toString();
        };

        const loadTide = async (dateYmd) => {
            const isLocalPreview = ['127.0.0.1', 'localhost'].includes(window.location.hostname);
            setStatus('불러오는 중', null);
            summaryEl.textContent = `${formatDateLabel(dateYmd)} 기준 데이터를 불러오는 중입니다.`;
            footnoteEl.textContent = '데이터 제공: Jebu Marina 공개 API';
            syncEmbedDate(dateYmd);

            try {
                const response = await fetch(`${apiBase}?date=${dateYmd}`, { method: 'GET' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const payload = await response.json();
                if (!payload?.success || !payload?.seaRoad) throw new Error('Invalid payload');

                const seaRoad = payload.seaRoad;
                const isOpenNow = seaRoad.isOpenNow === true;
                setStatus(isOpenNow ? '현재 열림' : '현재 닫힘', isOpenNow ? 'open' : 'closed');

                const nextText = seaRoad.nextChangeAt
                    ? `${isOpenNow ? '다음 닫힘' : '다음 열림'} ${seaRoad.nextChangeAt}`
                    : '다음 변경 시각 확인 중';

                summaryEl.textContent = `${formatDateLabel(dateYmd)} 기준 ${isOpenNow ? '바닷길 열림' : '바닷길 닫힘'} · ${nextText}`;
                renderTimeline(seaRoad.openWindows, dateYmd);
                renderOpenList(seaRoad.openWindows);
                renderWeather(payload.weather);
            } catch (error) {
                setStatus('데이터 지연', 'closed');
                timelineTrackEl.innerHTML = '';
                openListEl.innerHTML = '<li>잠시 후 다시 조회해 주세요.</li>';
                renderWeather(null);

                if (isLocalPreview) {
                    summaryEl.textContent = '로컬 미리보기 모드입니다. 실시간 데이터는 운영 도메인에서 표시됩니다.';
                    footnoteEl.textContent = '로컬 미리보기에서는 API Origin 제한(CORS)으로 조회가 제한될 수 있습니다.';
                    return;
                }

                summaryEl.textContent = '현재 데이터 지연 중입니다. 잠시 후 다시 조회해 주세요.';
            }
        };

        const params = new URLSearchParams(window.location.search);
        const initialDate = isYmd(params.get('date') || '') ? params.get('date') : getKstDate();
        dateInput.value = initialDate;
        loadTide(initialDate);
        const navList = document.getElementById('nav-list');
        if (navList) {
            navList.innerHTML = `
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/#tour" class="nav-link">요트투어</a></li>
                <li><a href="https://m.place.naver.com/place/1673800591/home" class="nav-link" target="_blank" rel="noopener noreferrer">예약문의</a></li>
            `;
        }

        tideForm.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!isYmd(dateInput.value)) return;
            const query = new URLSearchParams(window.location.search);
            query.set('date', dateInput.value);
            history.replaceState(null, '', `${window.location.pathname}?${query.toString()}`);
            loadTide(dateInput.value);
        });
    })();
</script>
{{- end }}
