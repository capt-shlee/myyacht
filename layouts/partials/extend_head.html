<link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"
    rel="stylesheet">
<link rel="preload" as="image" href="/images/hero-bg.JPEG" fetchpriority="high">

<!-- Open Graph tags are fully handled by themes/PaperMod/layouts/partials/templates/opengraph.html -->

{{- $adsense := partial "adsense_settings.html" . -}}
{{- if and $adsense.siteReviewEnabled $adsense.account }}
<meta name="google-adsense-account" content="{{ $adsense.account }}">
{{- end }}

{{- if and $.IsPage (eq $.Type "posts") $adsense.postsEnabled $adsense.client }}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ $adsense.client }}"
    crossorigin="anonymous"></script>
{{- end }}

<!-- Busuanzi Visitor Counter -->
