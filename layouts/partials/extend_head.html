<!-- Open Graph: Most tags are handled by themes/PaperMod/layouts/partials/templates/opengraph.html -->
<!-- Overriding OG Image if specific logic needed, or ensuring no conflict -->

{{- $keywords := "" -}}
{{- if .Params.keywords -}}
{{- $keywords = delimit .Params.keywords ", " -}}
{{- else if .Params.tags -}}
{{- $keywords = delimit .Params.tags ", " -}}
{{- end -}}
{{- if ne $keywords "" }}
<meta name="keywords" content="{{ $keywords }}" />
{{- end }}
